name : Run Autonomous AI Job Finder

on:
  schedule:
    - cron : '0 1 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./autonomous_job_finder

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browser Binaries
        run: |
          python -m playwright install chromium --with-deps

      - name: Execute LangGraph Automation Engine
        env:
          SMTP_SERVER: ${{secrets.SMTP_SERVER}}
          SMTP_PORT: ${{secrets.SMTP_PORT}}
          EMAIL_ADDRESS: ${{secrets.EMAIL_ADDRESS}}
          EMAIL_PASSWORD: ${{secrets.EMAIL_PASSWORD}}
        run: |
          python src/agent/graph.py

      - name: Commit and Push Status Change
        run: |
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
           
          git add autonomous_job_finder/data/jobs.db autonomous_job_finder/data/jobs.csv autonomous_job_finder/data/job_history.log || true
          
          git stash
          
          git pull --rebase origin master
          
          git stash pop || true
          
          git add autonomous_job_finder/data/jobs.db autonomous_job_finder/data/jobs.csv autonomous_job_finder/data/job_history.log || true
          
          # Commit and push cleanly
          git diff --quiet && git diff --staged --quiet || (git commit -m "Synchronized scraped data and logs" && git push origin HEAD:master)
