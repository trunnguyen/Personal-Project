name: Weekly Model Retraining Loop

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./autonomous_job_finder

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name : Execute Training Pipline
        run: |
          python src/analytics/training_pipeline.py

      - name: Commit and Push Updated Model Weights
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Use a relative path from inside the autonomous_job_finder directory
          git add data/classifier.pkl || true
          
          # Safely pull, rebase, and push changes back upstream to master
          git stash
          git pull --rebase origin master
          git stash pop || true
          git add data/classifier.pkl || true
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly model retraining completed" && git push origin HEAD:master)
