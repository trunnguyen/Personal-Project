name: Update Job Application Status

on:
  repository_dispatch:
    types: [mark_job_applied]

jobs:
  update-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      - name: Set up Python Environment 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install Runtime Dependencies
        run: |
          pip install pandas

      - name: Update Database Row
        run: |
          python -c "
          from src.utils.db_manager import JobDB
          
          # Initialize using your actual repo paths
          db = JobDB('data/jobs.db', 'data/jobs.csv')
          target_id = ${{ github.event.client_payload.job_id }}
          
          # This single native method safely handles the SQL update AND the CSV export cleanly!
          row_count = db.update_score_and_interest(job_id=target_id, is_applied=1)
          print(f'Successfully updated {row_count} row(s). Job {target_id} is marked as applied.')
          "

      - name: Commit and Push Status Change
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.db data/jobs.csv
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-Update: Marked Job ${{ github.event.client_payload.job_id }} as Applied [skip ci]"
          git push