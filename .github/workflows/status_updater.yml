name: Update Job Application Status

on:
  issues:
    types: [opened]

jobs:
  update-status:
    if: startsWith(github.event.issue.title, 'Applied to Job')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./autonomous_job_finder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Database Row
        working-directory: ./autonomous_job_finder
        run: |
          python -c "
          from src.utils.db_manager import JobDB
          db = JobDB('data/jobs.db','data/jobs.csv')
          body = '''${{ github.event.issue.body }}'''
          job_id = int(body.split(':')[1].strip())
          row_count = db.update_score_and_interest(job_id=job_id, is_applied=1)
          print(f'Updated {row_count} row(s) for job {job_id}')
          "

      - name: Commit and Push
        working-directory: ./autonomous_job_finder
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/jobs.db data/jobs.csv
          
          git stash
          git pull --rebase origin master
          git stash pop || true
    
          git add data/jobs.db data/jobs.csv
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mark job applied via issue" && git push)