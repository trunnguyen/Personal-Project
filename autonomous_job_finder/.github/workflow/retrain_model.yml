name: Weekly Model Retraining Loop

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name : Execute Training Pipline
        run: |
          python src/analytics/training_pipeline.py

      - name: Commit and Push Updated Model Weights
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add autonomous_job_finder/data/classifier.pkl
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly model retraining completed" && git push)