project:
  name: medical_ie_systems

paths:
  input_dir: data/raw/input
  output_dir: data/output
  logs: logs
  knowledge_dir: data/knowledge
  drug_dictionary: data/knowledge/drugs.csv
  symptom_dictionary: data/knowledge/symptoms.csv
  diagnosis_dictionary: data/knowledge/icd10.csv

pipeline:
  lowercase: false
  remove_extra_spaces: true

llm:
  base_url: http://localhost:11434
  model: qwen3:4b
  timeout: 1600
  temperature: 0.0
  max_tokens: 6000
  num_ctx: 12000
  keep_alive: 30m
  candidate_top_k: 3
